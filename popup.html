<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>YouTube Pause</h1>

    <div class="card">
      <div class="row">
        <span class="row-label">Block videos</span>
        <label class="switch">
          <input type="checkbox" id="toggle" />
          <span class="switch-track"><span class="switch-knob"></span></span>
        </label>
      </div>

      <div class="separator"></div>

      <div class="row row-stacked">
        <div class="row-top">
          <label class="row-label" for="duration">Pause duration</label>
          <span class="row-value"><span id="duration-value">3</span>&hairsp;s</span>
        </div>
        <input type="range" id="duration" min="1" max="60" step="1" value="3" />
      </div>
    </div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
