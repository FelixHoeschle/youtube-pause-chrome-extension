<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>YouTube Pause</h1>

    <div class="setting">
      <label>Blocking: <span id="enabled-state">On</span></label>
      <button id="toggle">Turn off</button>
    </div>

    <div class="setting">
      <label for="duration">Pause duration: <span id="duration-value">3</span>s</label>
      <input type="range" id="duration" min="3" max="10" step="1" value="3" />
    </div>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
